services:
  mysql:
    image: mysql:8.0
    container_name: techcrunch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: techcrunch
    ports:
      - "3307:3306"
    volumes:
      - techcrunch_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build: .
    container_name: techcrunch-scraper
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: techcrunch

volumes:
  techcrunch_mysql_data:
    external: true
